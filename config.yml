# Groupe docker = équivalent root sans mot de passe

#   Ajouter un utilisateur au groupe docker lui donne un accès complet au socket Unix /var/run/docker.sock. Quiconque peut parler à ce socket peut :

#   Escalade de privilèges triviale :
#   # Monte le système de fichiers hôte entier dans un container
#   docker run -v /:/host --rm -it alpine chroot /host
#   # → shell root sur la machine hôte, sans sudo, sans mot de passe
  
#   C'est documenté par le projet Docker lui-même : le groupe docker est équivalent à root sur la machine hôte.

#   Autres vecteurs :
#   - Lire n'importe quel fichier hôte (/etc/shadow, clés SSH, secrets)
#   - Modifier des fichiers système en montant /etc en volume
#   - Lancer des containers --privileged avec accès aux devices kernel
#   - Persister un accès même après rotation des mots de passe (via un container en arrière-plan)

#   ---
#   Dans ton contexte spécifique
  
#   Tes serveurs (Pi, Banana Pi, Orange Pi) sont sur un réseau local privé, avec accès SSH par clé uniquement. Le vrai risque dépend du modèle de menace :

#   ┌──────────────────────────────────────────────────┬──────────────────────────────────────────────────────────┐
#   │                     Scénario                     │                       Risque réel                        │
#   ├──────────────────────────────────────────────────┼──────────────────────────────────────────────────────────┤
#   │ Réseau local fermé, pas d'accès internet entrant │ Faible — si quelqu'un a déjà la clé SSH, il a déjà accès │
#   ├──────────────────────────────────────────────────┼──────────────────────────────────────────────────────────┤
#   │ dietpi est le seul utilisateur du serveur        │ Faible — pas d'autre utilisateur à protéger              │
#   ├──────────────────────────────────────────────────┼──────────────────────────────────────────────────────────┤
#   │ Serveur exposé sur internet (même partiellement) │ Élevé                                                    │
#   ├──────────────────────────────────────────────────┼──────────────────────────────────────────────────────────┤
#   │ Serveur exposé sur internet (même partiellement) │ Élevé                                                    │
#   ├──────────────────────────────────────────────────┼──────────────────────────────────────────────────────────┤
#   │ Plusieurs utilisateurs sur la même machine       │ Élevé                                                    │
#   └──────────────────────────────────────────────────┴──────────────────────────────────────────────────────────┘

#   ---
#   Alternatives plus sûres

#   Option 1 — sudo docker avec règle ciblée (recommandé)

#   Dans /etc/sudoers.d/docker-readonly sur chaque Pi :
#   dietpi ALL=(ALL) NOPASSWD: /usr/bin/docker ps *
#   dietpi ALL=(ALL) NOPASSWD: /usr/bin/docker stats *
#   Limite sudo aux seules commandes ps et stats — pas run, pas exec.

#   Option 2 — Socket en lecture seule via proxy (Docker Socket Proxy)

#   Un container tecnativa/docker-socket-proxy expose une API Docker filtrée (lecture seule). Plus complexe à mettre en place.

#   Option 3 — Garder le groupe docker (pragmatique)

#   Acceptable sur un réseau domestique fermé où dietpi est de toute façon sudoer complet. C'est ce que font la plupart des setups homelab.

#   ---
#   Ma recommandation pour ton cas

#   Ton dietpi a déjà NOPASSWD: /usr/bin/dd — il peut déjà écraser n'importe quel disque. Le groupe docker n'ajoute pas grand chose de pire dans ce contexte.

#   Mais si tu veux faire propre, l'option sudoers avec docker ps * et docker stats * est simple et limite l'exposition. Je peux mettre à jour containers.py pour utiliser sudo docker ps et sudo docker stats systématiquement — il suffira
#   d'ajouter ces deux lignes dans sudoers sur chaque Pi.

# ✻ Sautéed for 23s

# ❯ quand tu dis :"Ton dietpi a déjà NOPASSWD: /usr/bin/dd — il peut déjà écraser n'importe quel disque." y a t-il un manière de limiter l'action possible de dd de manière sure ?                                                            

# ● Oui, mais c'est difficile à faire de manière vraiment sûre.

#   Le problème avec dd

#   dd est générique par nature — il lit et écrit n'importe quoi vers n'importe quoi. Limiter dd en sudoers à un chemin de device spécifique :

#   dietpi ALL=(ALL) NOPASSWD: /usr/bin/dd if=/dev/mmcblk0 *

#   ...n'est pas fiable. Un attaquant peut contourner en passant les arguments dans un ordre différent, avec des espaces, ou en exploitant d'autres subtilités de parsing de sudoers.

#   Ce qui est réellement fiable

#   Remplacer dd par un script wrapper dédié, appartenant à root, non modifiable par dietpi :

#   #!/bin/bash
#   # /usr/local/bin/backup-dd — seul ce script est dans sudoers
#   exec dd if=/dev/mmcblk0 bs=4M "$@"

#   Sudoers pointe uniquement sur ce script :
#   dietpi ALL=(ALL) NOPASSWD: /usr/local/bin/backup-dd

#   Ainsi if= est fixé côté root, et dietpi ne peut pas le modifier.

#   La réalité pratique

#   Sur un réseau domestique fermé avec un seul utilisateur, la menace réelle est faible. Le vrai risque de NOPASSWD: dd c'est surtout une erreur humaine (mauvais of=) plus qu'une attaque. Le wrapper wrapper protège aussi contre ça.

