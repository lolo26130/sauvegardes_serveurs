#   ┌──────────────────┬─────────────────────────────────────────┐
#   │ Outil disponible │           Mode de sauvegarde            │
#   ├──────────────────┼─────────────────────────────────────────┤
#   │ dd + gzip        │ make backup (streaming PC) ✅           │
#   ├──────────────────┼─────────────────────────────────────────┤
#   │ + tmux           │ make tmux aussi ✅                      │
#   ├──────────────────┼─────────────────────────────────────────┤
