# NETWORK FOR BACKUPS 
# - _netdev : indique au système que ce montage dépend du réseau — 
# systemd attend que le réseau soit up avant de le monter au boot
# - hard : si le NAS devient inaccessible, les opérations I/O bloquent 
# (attendent le retour du NAS) plutôt que d'échouer avec une erreur.
# Adapté à un usage backup : on préfère attendre plutôt que corrompre une écriture en cours
# - Montage automatique au boot, synchrone, dans la séquence normale de démarrage
#----------------------------------------------------------------
# 192.168.0.21:/volume2/Volume_2/ALL_servers_SP3C_backups  /mnt/NAS_sauvegardes  nfs4  defaults,_netdev,hard,rsize=131072,wsize=131072  0  0
