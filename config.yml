#   Mode tmux sur HAOS probablement impossible (pas de package manager pour installer tmux sur buildroot), mais make backup suffira — la sauvegarde stream via ton PC comme pour les autres.

#   Colle la sortie de which dd gzip lz4 tmux sudo et lsblk et j'ajuste la config.



