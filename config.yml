# Bonne nouvelle : HAOS a dd et ssh intégrés. Quelques spécificités à gérer.

#   Étape 1 — Sur la console HAOS : ajouter ta clé SSH

#   mkdir -p ~/.ssh
#   echo "$(cat ~/.ssh/id_rsa.pub)" >> ~/.ssh/authorized_keys  # coller ta clé publique
#   chmod 700 ~/.ssh
#   chmod 600 ~/.ssh/authorized_keys

#   Vérifie que ça persiste au reboot (overlay filesystem) — si non, on verra une alternative.

#   Vérifie aussi ce qui est disponible :
#   which dd gzip lz4 tmux sudo
#   lsblk 
  
#   Colle la sortie — en particulier sudo et tmux qui sont probablement absents sur HAOS (pas de gestionnaire de paquets).

#   ---
#   Étape 2 — Adaptation du code : option no_sudo
  
#   HAOS se connecte en root directement — sudo n'est ni nécessaire ni forcément disponible. J'ajoute une option no_sudo par serveur dans config.yml :
# Étape 3 — Vérifier depuis la console HAOS

#   Lance ces commandes sur la console HAOS pour confirmer ce qui est disponible :

#   lsblk
#   which dd gzip lz4 tmux sudo

#   Et pour tester l'accès SSH depuis ton PC une fois la clé ajoutée :
#   ! ssh root@192.168.0.54 "lsblk"

