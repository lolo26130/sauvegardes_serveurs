# ❯ mais mon réseau local est relié à internet                                                                                                                                                                                                

# ● Ça change le modèle de menace de façon significative.

#   La chaîne d'attaque réelle

#   Tes serveurs font tourner des containers web (ports 80, 81, 443, 8015, 8016… visibles dans le ps aux). Si l'un d'eux est exposé sur internet via ton routeur :

#   Internet → routeur (NAT/port forward) → container web vulnérable
#   → shell dans le container → escape vers hôte
#   → dietpi avec NOPASSWD dd → lecture/écriture disque entier

#   L'escape de container n'est pas trivial, mais c'est une technique documentée, surtout si un container tourne avec des volumes montés vers l'hôte ou en mode --privileged.

#   Ce qu'il faut faire

#   Pour dd — le wrapper est la vraie solution :

#   Sur chaque Pi, créer /usr/local/bin/backup-dd (root, non modifiable) :

#   #!/bin/bash
#   # Seul if= est autorisé, of= n'est pas un paramètre — la sortie va sur stdout
#   exec /usr/bin/dd if=/dev/mmcblk0 bs=4M "$@"

#   sudo chown root:root /usr/local/bin/backup-dd
#   sudo chmod 755 /usr/local/bin/backup-dd

#   Sudoers :
#   dietpi ALL=(ALL) NOPASSWD: /usr/local/bin/backup-dd
  
#   Et supprimer la ligne NOPASSWD: /usr/bin/dd.

#   Pour Docker — sudoers limité :

#   dietpi ALL=(ALL) NOPASSWD: /usr/bin/docker ps *
#   dietpi ALL=(ALL) NOPASSWD: /usr/bin/docker stats *

#   Pas de groupe docker, pas de docker run, pas de docker exec.

